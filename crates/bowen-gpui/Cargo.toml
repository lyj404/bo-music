[package]
name = "bowen-gpui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bowen-app.workspace = true
bowen-domain.workspace = true
bowen-playback.workspace = true
gpui = "=0.2.2"
image = { version = "0.25.10", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61.3", features = ["Foundation", "Media", "Storage_Streams", "Win32_System_WinRT"] }
windows-future = "0.2.1"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
