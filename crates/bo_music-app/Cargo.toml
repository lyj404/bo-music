[package]
name = "bo_music-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bo_music-api.workspace = true
bo_music-domain.workspace = true
bo_music-playback.workspace = true
bo_music-storage.workspace = true
reqwest.workspace = true
base64.workspace = true
qrcode = { version = "0.14.1", default-features = false }
resvg = "=0.45.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3.27"
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
bo_music-api = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile = "3.27"
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }
