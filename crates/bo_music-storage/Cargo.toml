[package]
name = "bo_music-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bo_music-domain.workspace = true
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "crypto-rust", "tokio"] }
