[workspace]
default-members = ["crates/bo_music"]
members = ["crates/bo_music-api", "crates/bo_music-domain", "crates/bo_music-cli", "crates/bo_music-playback", "crates/bo_music-app", "crates/bo_music-storage", "crates/bo_music"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[workspace.dependencies]
bo_music-domain = { path = "crates/bo_music-domain" }
bo_music-api = { path = "crates/bo_music-api" }
bo_music-playback = { path = "crates/bo_music-playback" }
bo_music-app = { path = "crates/bo_music-app" }
bo_music-storage = { path = "crates/bo_music-storage" }
md5 = "0.8.1"
base64 = "0.22.1"
libloading = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt", "time"] }
