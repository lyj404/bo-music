name: Rust preview builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - run: cargo build --release --locked -p bowen-gpui
      - name: Copy the Windows audio runtime beside the executable
        shell: pwsh
        run: Copy-Item libmpv/libmpv-2.dll target/release/libmpv-2.dll
      - uses: actions/upload-artifact@v4
        with:
          name: BowenRust-windows-x64
          if-no-files-found: error
          path: |
            target/release/bowen-gpui.exe
            target/release/libmpv-2.dll

  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libvulkan-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo build --release --locked -p bowen-gpui
      - run: sh tools/package-rust-linux.sh target/release/bowen-gpui target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: BowenRust-linux-x64
          if-no-files-found: error
          path: |
            target/dist/*.tar.gz
            target/dist/*_SHA256SUMS.txt
