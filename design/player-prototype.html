.drawer.lyrics-full{inset:34px 0 94px;width:auto;border:0;border-radius:0;box-shadow:none;padding:0;overflow:hidden;background:radial-gradient(ellipse at 12% 85%,#b8a5d52b,transparent 55%),radial-gradient(ellipse at 85% 15%,#9baed52b,transparent 60%),var(--bg)}

function svg(n){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[n]||icons.music}"/></svg>`}function hydrate(){document.querySelectorAll('[data-icon]').forEach(e=>{e.insertAdjacentHTML('afterbegin',svg(e.dataset.icon));e.removeAttribute('data-icon')})}
const albums=[['林间来信','让旋律陪你慢下来','Forest',1],['深夜独白','属于自己的安静时刻','Midnight',2],['落日漫游','一场不设终点的旅行','Sunset',3],['晴空与海','把日常调成蓝色','Blue',4],['复古留声机','那些反复聆听的声音','Echoes',5]];const songs=[['丑八怪','薛之谦','意外'],['像风一样','薛之谦','渡'],['晴天','周杰伦','叶惠美'],['慢慢喜欢你','莫文蔚','我们在中场相遇'],['旅行的意义','陈绮贞','华丽的冒险'],['平凡之路','朴树','猎户星座']];let current='home',history=[],playing=false,songIndex=0,drawerMode='';
function art(a,i){return `<div class="art a${a[3]||i%5+1}"><span>${a[2]}<small>BO_MUSIC COLLECTION</small></span></div>`}function cards(){return '<div class="cards">'+albums.map((a,i)=>`<button class="card" onclick="navigate('playlist')">${art(a,i)}<h3>${a[0]}</h3><div class="muted">${a[1]}</div></button>`).join('')+'</div>'}function tracks(){return '<div class="tracks">'+songs.map((s,i)=>`<div class="track" role="button" tabindex="0" onclick="selectSong(${i})" onkeydown="if(event.key==='Enter')selectSong(${i})">${art(albums[i%5],i)}<div class="track-info"><strong>${s[0]}</strong><span class="muted">${s[1]} · ${s[2]}</span></div><span class="duration">${i%2?'03:42':'04:08'}</span><button class="icon" aria-label="播放 ${s[0]}">${svg('play')}</button></div>`).join('')+'</div>'}function heading(t,action='查看全部'){return `<div class="section-head"><h2>${t}</h2><button class="text-button" onclick="navigate('playlists')">${action} ›</button></div>`}function table(){return '<div class="table-head"><span>#</span><span>歌曲</span><span>专辑</span><span>时长</span></div>'+songs.map((s,i)=>`<div class="table-row" role="button" tabindex="0" onclick="selectSong(${i})" onkeydown="if(event.key==='Enter')selectSong(${i})"><span class="muted">${String(i+1).padStart(2,'0')}</span><div>${s[0]}<div class="muted">${s[1]}</div></div><span class="muted">${s[2]}</span><span class="muted">4:08</span></div>`).join('')}
function navigate(p,push=true){if(push&&p!==current)history.push(current);current=p;document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('active',e.dataset.page===p));let h='';if(p==='home'){h=`<div class="eyebrow">YOUR DAILY INSPIRATION</div><h1>发现好音乐</h1><section class="hero"><div class="hero-copy"><div class="eyebrow" style="color:#847393">为今天，留一点音乐</div><h2>让喜欢的旋律<br>陪你度过每个日常。</h2><p>每日精选 · 从熟悉的声音，遇见新的喜欢</p><button class="primary" onclick="selectSong(0)">${svg('play')} 播放今日精选</button></div><div class="hero-art"><div class="record"></div>${art(albums[1],1)}</div></section>${heading('为你精选')}${cards()}${heading('此刻想听','换一批')}${tracks()}`}
else if(p==='library'||p==='playlists'){h=`<div class="eyebrow">${p==='library'?'EXPLORE':'YOUR COLLECTION'}</div><h1>${p==='library'?'音乐馆':'我的歌单'}</h1><div class="tabs"><button class="current" onclick="tab(this)">精选歌单</button><button onclick="tab(this)">专辑</button><button onclick="tab(this)">歌手</button><button onclick="tab(this)">音乐风格</button></div>${cards()}${heading('编辑推荐')}${cards()}`}
else if(p==='playlist'||p==='liked'){h=`<div class="playlist-hero">${art(albums[p==='liked'?0:1],1)}<div><div class="eyebrow">${p==='liked'?'YOUR FAVORITES':'PLAYLIST'}</div><h1>${p==='liked'?'我喜欢的音乐':'一个人的夜晚'}</h1><p class="muted">波纹 · 36 首歌曲 · 最近更新于今天</p><p class="muted">把喧嚣留在白天，让音乐慢慢靠近。</p><button class="primary" onclick="selectSong(0)">${svg('play')} 播放全部</button> <button class="icon" onclick="toast('歌单更多操作')">${svg('more')}</button></div></div>${table()}`}
else if(p==='settings'){h=`<div class="eyebrow">PREFERENCES</div><h1>设置</h1><div class="tabs"><button class="current" onclick="tab(this)">外观</button><button onclick="tab(this)">播放</button><button onclick="tab(this)">快捷键</button></div><h2>个性化</h2><div class="setting"><div>应用主题<div class="muted">选择适合你的界面外观</div></div><div class="segmented"><button onclick="setTheme(false)">浅色</button><button onclick="setTheme(true)">深色</button></div></div><div class="setting"><div>窗口材质<div class="muted">柔和的背景层次与透明质感</div></div><button class="text-button" onclick="toast('原生窗口材质将在 GPUI 中实现')">Mica 云母 ›</button></div><div class="setting"><div>界面字体<div class="muted">跟随系统字体，保持清晰易读</div></div><button class="text-button" onclick="toast('字体选择器 · 设计预览')">系统默认 ›</button></div><div class="setting"><div>默认音质<div class="muted">优先使用所选音质播放</div></div><div class="segmented"><button onclick="choice(this)">标准</button><button class="selected" onclick="choice(this)">高品质</button><button onclick="choice(this)">无损</button></div></div>`}
else if(p==='search'){h=`<div class="eyebrow">SEARCH RESULTS</div><h1>搜索结果</h1><p class="muted" id="querylabel"></p><div class="tabs"><button class="current" onclick="tab(this)">综合</button><button onclick="tab(this)">歌曲</button><button onclick="tab(this)">歌单</button><button onclick="tab(this)">专辑</button></div>${heading('歌曲')}${tracks()}${heading('相关歌单')}${cards()}`}
else if(p==='recent'){h=`<div class="eyebrow">LISTENING HISTORY</div><h1>最近播放</h1><p class="muted">今天 · 继续聆听你喜欢的声音</p>${table()}`}
else{h=`<div class="eyebrow">CHARTS</div><h1>音乐排行榜</h1>${cards()}${heading('本周热门')}${tracks()}`}
document.getElementById('content').innerHTML=h;if(p==='search')document.getElementById('querylabel').textContent='“'+document.getElementById('search').value+'” 的示例搜索结果';document.querySelector('.main').scrollTop=0}
function selectSong(i){songIndex=(i+songs.length)%songs.length;document.getElementById('songtitle').textContent=songs[songIndex][0];document.getElementById('songartist').textContent=songs[songIndex][1];playing=true;updatePlay();if(drawerMode)renderDrawer()}function next(d){selectSong(songIndex+d)}function updatePlay(){document.getElementById('play').innerHTML=svg(playing?'pause':'play');document.getElementById('play').ariaLabel=playing?'暂停':'播放'}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2200)}function setTheme(d){document.body.classList.toggle('dark',d)}function tab(e){e.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('current'));e.classList.add('current');toast('当前为布局预览，分类内容使用示例数据')}function choice(e){e.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));e.classList.add('selected')}
const demoLyrics=['把窗外的灯光轻轻收藏','让忙碌的时针暂时停放','这一刻不必赶向远方','听一段旋律缓缓流淌','沿着晚风经过的长街','拾起今天未说完的愿望','让每一个平凡的瞬间','都拥有自己的回响','当城市慢慢安静下来','还有音乐陪在身旁','把心事交给夜色保管','把温柔留给明天的阳光','不必寻找标准的答案','也不必成为别人的模样','在这一首歌的时间里','听见属于自己的方向','让最后一个音符落下','我们再继续走向远方'];
function toggleDrawer(mode){const opening=drawerMode!==mode;drawerMode=opening?mode:'';renderDrawer();if(drawerMode==='lyrics')document.getElementById('close-lyrics').focus();else if(!drawerMode)document.getElementById(mode==='lyrics'?'lyrics':'queue').focus()}
function renderDrawer(){const d=document.getElementById('drawer');d.classList.toggle('open',!!drawerMode);d.classList.toggle('lyrics-full',drawerMode==='lyrics');document.getElementById('lyrics').classList.toggle('selected',drawerMode==='lyrics');document.getElementById('queue').classList.toggle('selected',drawerMode==='queue');if(!drawerMode){d.innerHTML='';return}
if(drawerMode==='lyrics'){d.innerHTML=`<div class="drawer-heading"><button class="lyrics-close" id="close-lyrics" onclick="toggleDrawer('lyrics')" aria-label="关闭全屏歌词">${svg('back')} 收起歌词 <span style="opacity:.5;margin-left:8px">Esc</span></button><span class="lyrics-hint">沉浸歌词 · 滚动查看完整歌词</span><button class="icon" onclick="toggleDrawer('lyrics')" aria-label="关闭全屏歌词">${svg('close')}</button></div><div class="lyrics-layout"><section class="lyrics-album">${art(albums[1],1)}<div><h2>${songs[songIndex][0]}</h2><div class="muted">${songs[songIndex][1]} · ${songs[songIndex][2]}</div><div class="lyric-meta">设计预览 · 以下为原创示例歌词</div></div></section><section class="lyrics-scroll" aria-label="完整歌词">${demoLyrics.map((line,i)=>`<button class="lyric-line ${i===4?'active-line':''}" onclick="activateLyric(this,${i})">${line}</button>`).join('')}</section></div>`}
else d.innerHTML=`<div class="drawer-heading"><strong>播放队列 · 6 首</strong><button class="icon" onclick="toggleDrawer('queue')" aria-label="关闭队列">${svg('close')}</button></div>`+tracks()}
function activateLyric(button,index){document.querySelectorAll('.lyric-line').forEach(e=>e.classList.remove('active-line'));button.classList.add('active-line');const progress=document.getElementById('progress');progress.value=Math.round(index/(demoLyrics.length-1)*248);progress.dispatchEvent(new Event('input'));button.scrollIntoView({behavior:'smooth',block:'center'})}

document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>navigate(e.dataset.page));document.getElementById('searchform').onsubmit=e=>{e.preventDefault();navigate('search')};document.getElementById('back').onclick=()=>{if(history.length)navigate(history.pop(),false)};document.getElementById('theme').onclick=()=>setTheme(!document.body.classList.contains('dark'));document.getElementById('play').onclick=()=>{playing=!playing;updatePlay()};document.getElementById('like').onclick=e=>e.currentTarget.classList.toggle('selected');document.getElementById('mode').onclick=()=>toast('随机播放 · 示例状态');document.getElementById('lyrics').onclick=()=>toggleDrawer('lyrics');document.getElementById('queue').onclick=()=>toggleDrawer('queue');document.getElementById('progress').oninput=e=>document.getElementById('elapsed').textContent=Math.floor(e.target.value/60)+':'+String(e.target.value%60).padStart(2,'0');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerMode){toggleDrawer(drawerMode)}});hydrate();navigate('home',false);
</script></html>
